services:
  # ==============================================================================
  # PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medlens_db}
      POSTGRES_USER: ${POSTGRES_USER:-medlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medlens_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medlens_user} -d ${POSTGRES_DB:-medlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # MedLens FastAPI Backend Service (Containerized dev/prod profile)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medlens-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+psycopg://medlens_user:medlens_password@postgres:5432/medlens_db
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./uploads:/app/uploads
    profiles:
      - fullstack

  # ==============================================================================
  # MedLens React Frontend Service (Containerized dev/prod profile)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medlens-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src
    profiles:
      - fullstack

volumes:
  pgdata:
    name: medlens_pgdata
